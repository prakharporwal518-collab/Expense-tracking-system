<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FinTrack — expense tracking with forecasting, anomaly detection and subscription discovery.">
  <title>FinTrack</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">💰</div>
    <div class="boot-spinner"></div>
  </div>

  <div id="app" hidden></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <div id="palette" class="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" class="palette-input" type="text" placeholder="Type a command or an expense…  e.g. 450 lunch at dominos yesterday" autocomplete="off" spellcheck="false">
      <div id="palette-results" class="palette-results"></div>
      <div class="palette-foot"><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> run <kbd>esc</kbd> close</div>
    </div>
  </div>

  <noscript>
    <div style="padding:2rem;font-family:system-ui;color:#e2e8f0;background:#0f172a">
      FinTrack needs JavaScript enabled to run.
    </div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
